<style id="app-style">
/* IPEIN Examens — barre latérale encre profonde, plan de travail clair et calme, bleu IPEIN pour l'action */
:root {
  --ink: #0d2236;          /* texte principal, encre institutionnelle */
  --ink-2: #3b5168;        /* texte secondaire */
  --muted: #64788c;
  --bg: #eef3f7;           /* fond de travail, gris bleuté */
  --surface: #ffffff;
  --surface-2: #f6f9fb;
  --line: #dde6ee;
  --line-2: #c6d3de;
  --brand: #00aeef;        /* bleu du logo IPEIN */
  --brand-ink: #0077b6;    /* bleu d'action lisible */
  --brand-ink-2: #005e91;
  --brand-wash: #e3f4fc;
  --side: #0c2133;         /* barre latérale */
  --side-2: #132e45;
  --side-fg: #c9d8e6;
  --side-fg-2: #8aa3ba;
  --ok: #0f7a5c; --ok-wash: #e2f3ec;
  --warn: #a45a00; --warn-wash: #fdf0dc;
  --err: #b42318; --err-wash: #fdecea;
  --violet: #5b3fc4; --violet-wash: #eeeafc;
  --shadow: 0 1px 2px rgba(13, 34, 54, .05), 0 2px 8px rgba(13, 34, 54, .04);
  --shadow-lg: 0 18px 48px rgba(13, 34, 54, .18);
  --radius: 12px;
  --radius-sm: 8px;
  --font-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --on-brand: #ffffff; --on-ok: #ffffff; --on-err: #ffffff;
  --sidebar-w: 268px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6eef6; --ink-2: #b7c7d6; --muted: #8ba0b5;
    --bg: #0a1622; --surface: #102131; --surface-2: #0d1c2a; --line: #1f3549; --line-2: #2c4660;
    --brand: #28bdf2; --brand-ink: #4cc3f2; --brand-ink-2: #7fd4f6; --brand-wash: #0f3047;
    --side: #07121c; --side-2: #0e2132; --side-fg: #c9d8e6; --side-fg-2: #7f98af;
    --ok: #4fd1a5; --ok-wash: #0f2e26; --warn: #f5b454; --warn-wash: #33240f; --err: #ff8a7a; --err-wash: #3a1714; --violet: #b3a3ff; --violet-wash: #231d42;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
    --on-brand: #04263a; --on-ok: #04261c; --on-err: #2a0805;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6eef6; --ink-2: #b7c7d6; --muted: #8ba0b5;
  --bg: #0a1622; --surface: #102131; --surface-2: #0d1c2a; --line: #1f3549; --line-2: #2c4660;
  --brand: #28bdf2; --brand-ink: #4cc3f2; --brand-ink-2: #7fd4f6; --brand-wash: #0f3047;
  --side: #07121c; --side-2: #0e2132; --side-fg: #c9d8e6; --side-fg-2: #7f98af;
  --ok: #4fd1a5; --ok-wash: #0f2e26; --warn: #f5b454; --warn-wash: #33240f; --err: #ff8a7a; --err-wash: #3a1714; --violet: #b3a3ff; --violet-wash: #231d42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
  --on-brand: #04263a; --on-ok: #04261c; --on-err: #2a0805;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0 0 .4rem; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; font-weight: 600; }
h2 { font-size: 1.06rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0 0 .7rem; }
svg[aria-hidden] { width: 1.05em; height: 1.05em; stroke: currentColor; flex: none; vertical-align: -.16em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: .88em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; border-radius: 4px; }
.sep { border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- Démarrage ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; color: var(--ink-2); padding: 24px; }
.boot img { background: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--side-2) transparent; }
.brand { display: flex; flex-direction: column; gap: 10px; padding: 20px 18px 16px; text-decoration: none; }
.brand:hover { text-decoration: none; }
.brand img { display: block; width: 100%; max-width: 210px; background: #fff; border-radius: 10px; padding: 10px 12px; }
.brand span { font-family: var(--font-display); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--side-fg-2); padding-left: 2px; }
.nav { padding: 4px 10px 18px; flex: 1; }
.nav-group { margin-top: 14px; }
.nav-group > .label { font-family: var(--font-display); font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--side-fg-2); padding: 4px 12px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 8px; color: var(--side-fg); font-weight: 500; font-size: .94rem; position: relative; }
.nav a:hover { background: var(--side-2); color: #fff; text-decoration: none; }
.nav a.active { background: var(--side-2); color: #fff; }
.nav a.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
.nav a svg { width: 18px; height: 18px; opacity: .85; }
.nav .count { margin-left: auto; background: var(--brand); color: #04263a; border-radius: 999px; font-size: .72rem; padding: 0 7px; font-weight: 700; line-height: 1.6; }
.sidebar .foot { padding: 14px 20px 18px; font-size: .76rem; color: var(--side-fg-2); border-top: 1px solid var(--side-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 62px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.topbar .title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.topbar .mobile-logo { display: none; height: 30px; background: #fff; border-radius: 6px; padding: 3px 6px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--err); color: var(--on-err); font-size: .7rem; font-weight: 700; display: grid; place-items: center; }
.menu-toggle { display: none; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.user-chip:hover { text-decoration: none; background: var(--surface-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-ink); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; font-size: .78rem; font-family: var(--font-display); }
.user-chip .who { line-height: 1.15; font-size: .86rem; font-weight: 600; }
.user-chip .who small { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
.save-state { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.save-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.save-state.busy i { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
.save-state.warn i { background: var(--warn); }
.save-state.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, var(--line)); background: var(--err-wash); }
.save-state.err i { background: var(--err); }
@keyframes pulse { 50% { opacity: .35; } }
.remote-badge { font: inherit; font-size: .8rem; font-weight: 600; border: 0; border-radius: 999px; background: var(--brand-wash); color: var(--brand-ink); padding: 6px 12px; cursor: pointer; }
.content { width: 100%; max-width: 1380px; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); font-size: .88rem; border-bottom: 1px solid var(--line); }
.banner svg { margin-top: 3px; }
.banner .btn { margin-left: 6px; }
.banner.info { background: var(--brand-wash); color: var(--ink); }
.banner.warn { background: var(--warn-wash); color: var(--ink); }
.banner.err { background: var(--err-wash); color: var(--ink); }

.page-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.page-head > div:first-child { min-width: 0; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.breadcrumb { font-size: .84rem; color: var(--muted); margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card + .card, .card + .grid, .grid + .card, .grid + .grid, .kpis + .card, .kpis + .grid { margin-top: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { margin: 0; }
.card-body { padding: 18px; }
.card-body.tight { padding: 0; }
.grid { display: grid; gap: 18px; }
.grid > * { min-width: 0; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.side { grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); }
.grid.side > div > .card + .card { margin-top: 18px; }
.subform { padding: 16px 18px; border-top: 1px solid var(--line); background: var(--surface-2); }
.subform h3 { font-size: .9rem; margin-bottom: 10px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 18px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi .k-label { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.kpi .k-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: none; }
.kpi.ok .k-label::before { background: var(--ok); }
.kpi.warn .k-label::before { background: var(--warn); }
.kpi.err .k-label::before { background: var(--err); }
.kpi .k-value { font-family: var(--font-display); font-size: 1.85rem; font-weight: 600; color: var(--ink); line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
.kpi .k-sub { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > span { display: block; height: 100%; background: var(--brand-ink); border-radius: 999px; }
.progress.ok > span { background: var(--ok); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px; border-radius: 9px; border: 1px solid transparent; font: inherit; font-weight: 600; font-size: .92rem; line-height: 1.2; cursor: pointer; white-space: nowrap; background: var(--brand-ink); color: var(--on-brand); transition: background .15s, border-color .15s, box-shadow .15s; }
.btn:hover { background: var(--brand-ink-2); text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.secondary:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.ghost { background: transparent; color: var(--brand-ink); }
.btn.ghost:hover { background: var(--brand-wash); }
.btn.danger { background: var(--surface); color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
.btn.danger:hover { background: var(--err-wash); }
.btn.success { background: var(--ok); color: var(--on-ok); }
.btn.success:hover { background: color-mix(in srgb, var(--ok) 85%, #000); }
.btn.sm { padding: 5px 10px; font-size: .83rem; border-radius: 7px; }
.btn[disabled], .btn.is-loading { opacity: .6; cursor: not-allowed; }
.btn.is-loading::after { content: ""; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
label.btn { cursor: pointer; }
.inline-form { display: inline; margin: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.blue { background: var(--brand-wash); color: var(--brand-ink); border-color: transparent; }
.badge.ok { background: var(--ok-wash); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-wash); color: var(--warn); border-color: transparent; }
.badge.err { background: var(--err-wash); color: var(--err); border-color: transparent; }
.badge.violet { background: var(--violet-wash); color: var(--violet); border-color: transparent; }
.badge.gray { background: var(--surface-2); color: var(--muted); }

.alert { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; border: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; background: var(--surface); color: var(--ink); }
.alert svg { margin-top: 3px; }
.alert > div { min-width: 0; overflow-wrap: anywhere; }
.alert.success { background: var(--ok-wash); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.alert.success svg { color: var(--ok); }
.alert.error { background: var(--err-wash); border-color: color-mix(in srgb, var(--err) 30%, transparent); }
.alert.error svg { color: var(--err); }
.alert.warning { background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.alert.warning svg { color: var(--warn); }
.alert.info { background: var(--brand-wash); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
.alert.info svg { color: var(--brand-ink); }
.alert .close { margin-left: auto; background: none; border: 0; cursor: pointer; color: inherit; font-size: 1.15rem; line-height: 1; padding: 0 2px; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th { text-align: left; font-family: var(--font-display); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.table th a { color: inherit; }
.table th a.sorted { color: var(--brand-ink); }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: color-mix(in srgb, var(--brand-wash) 35%, transparent); }
.table td.actions-cell { text-align: right; white-space: nowrap; }
.table td.actions-cell > * + * { margin-left: 4px; }
.table .sub { display: block; font-size: .8rem; color: var(--muted); }

/* ---------- Formulaires ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.field { min-width: 0; }
.field > label, .label-text { display: block; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.label-text { margin-bottom: 5px; }
.field label > input, .field label > select, .field label > textarea { margin-top: 6px; font-weight: 400; }
.field .hint { font-size: .8rem; color: var(--muted); margin-top: 5px; }
.req { color: var(--err); }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], input[type=datetime-local], input[type=search], input[type=file], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 9px; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); min-width: 0;
}
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
textarea { min-height: 96px; resize: vertical; }
select[multiple] { min-height: 170px; }
.check { display: inline-flex; align-items: center; gap: 9px; font-size: .93rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--brand-ink); }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin: 0; }
legend { font-family: var(--font-display); font-weight: 600; font-size: .86rem; padding: 0 6px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .82rem; margin: 18px 0; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toolbar .field { min-width: 150px; }
.toolbar .field.grow { flex: 1; min-width: 200px; }
.toolbar .field label { font-family: var(--font-display); font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.toolbar .field label > input, .toolbar .field label > select { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: .92rem; color: var(--ink); }

.pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: .86rem; color: var(--muted); }
.pagination .pages { display: flex; gap: 4px; }
.pagination a, .pagination span.cur { min-width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; color: var(--ink); }
.pagination span.cur { background: var(--brand-ink); color: var(--on-brand); border-color: var(--brand-ink); font-weight: 700; }
.pagination a:hover { background: var(--surface-2); text-decoration: none; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty svg { width: 42px; height: 42px; stroke: var(--line-2); margin-bottom: 10px; }
.empty h3 { color: var(--ink); margin-bottom: 4px; }
.empty .btn { margin-top: 10px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tabs a.active { color: var(--brand-ink); border-color: var(--brand-ink); }
.tabs a:hover { text-decoration: none; color: var(--ink); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list .meta { font-size: .8rem; color: var(--muted); }
.date-box { width: 50px; flex: none; text-align: center; border-radius: 10px; background: var(--brand-wash); color: var(--brand-ink); padding: 5px 0; line-height: 1.05; font-family: var(--font-display); }
.date-box b { display: block; font-size: 1.15rem; font-weight: 600; }
.date-box small { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; }
dl.props { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: .93rem; }
dl.props dt { color: var(--muted); font-weight: 600; }
dl.props dd { margin: 0; overflow-wrap: anywhere; }
.steps-list { padding-left: 20px; line-height: 1.7; margin: 0 0 12px; }

.confidential { border: 1px dashed color-mix(in srgb, var(--err) 45%, var(--line)); background: color-mix(in srgb, var(--err-wash) 55%, var(--surface)); border-radius: var(--radius-sm); padding: 12px 14px; }
.confidential .tag { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: .68rem; font-weight: 600; letter-spacing: .12em; color: var(--err); text-transform: uppercase; }

/* ---------- Planning ---------- */
.slot { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 16px; box-shadow: var(--shadow); }
.slot-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
.slot-head .when { font-family: var(--font-display); font-weight: 600; text-transform: capitalize; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 14px; }
.room { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-width: 0; }
.room.incomplete { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-wash) 45%, var(--surface)); }
.room.complete { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.room-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.room-head b { font-family: var(--font-display); font-weight: 600; }
.people { list-style: none; margin: 0 0 6px; padding: 0; }
.people li { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: .9rem; border-bottom: 1px dashed var(--line); }
.people li:last-child { border-bottom: 0; }
.people .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.missing { color: var(--warn); font-size: .85rem; font-weight: 600; }

.day { margin-bottom: 16px; }
.day h3 { font-size: .95rem; margin-bottom: 8px; }
.slot-choice { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
.slot-choice.st-disponible { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok-wash) 60%, var(--surface)); }
.slot-choice.st-indisponible { border-color: color-mix(in srgb, var(--err) 40%, var(--line)); background: color-mix(in srgb, var(--err-wash) 55%, var(--surface)); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg label { padding: 6px 11px; font-size: .85rem; cursor: pointer; border-left: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 4px; user-select: none; position: relative; }
.seg label:first-child { border-left: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--brand-wash); color: var(--brand-ink); font-weight: 700; }
.seg label.dispo:has(input:checked) { background: var(--ok); color: var(--on-ok); }
.seg label.indispo:has(input:checked) { background: var(--err); color: var(--on-err); }
.seg label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); }
.slot-choice input[type=text] { padding: 6px 9px; font-size: .86rem; }
.sticky-bar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 5; border-radius: 0 0 var(--radius) var(--radius); }

.steps { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.steps li .n { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; font-weight: 700; font-size: .74rem; background: var(--surface); font-family: var(--font-display); }
.steps li.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.steps li.current { color: var(--ink); font-weight: 600; }
.steps li.current .n { border-color: var(--brand-ink); color: var(--brand-ink); }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: .86rem; }
.bar-row .track { background: var(--line); border-radius: 6px; height: 10px; overflow: hidden; }
.bar-row .track span { display: block; height: 100%; background: var(--brand-ink); border-radius: 6px; }
.bar-row .track span.ok { background: var(--ok); }
.bar-row .track span.over { background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Calendrier */
.seg-links { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
.seg-links a { padding: 6px 12px; font-size: .86rem; color: var(--ink); }
.seg-links a + a { border-left: 1px solid var(--line-2); }
.seg-links a.active { background: var(--brand-ink); color: var(--on-brand); }
.seg-links a:hover { text-decoration: none; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-head { background: var(--surface-2); font-family: var(--font-display); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px; text-align: center; border-bottom: 1px solid var(--line); }
.cal-cell { min-height: 108px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell.out { background: var(--surface-2); }
.cal-cell.out .cal-day { opacity: .45; }
.cal-cell.today { background: var(--brand-wash); }
.cal-day { font-size: .8rem; font-weight: 600; text-align: right; }
.cal-ev { display: block; font-size: .74rem; line-height: 1.3; padding: 2px 5px; border-radius: 4px; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-left: 3px solid var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.all { background: var(--c); color: #fff; border-left: 0; }
.cal-ev:hover { text-decoration: none; filter: brightness(.96); }
.cal-more { font-size: .72rem; }
.cal-list-day { margin-bottom: 16px; }
.cal-list-day h3 { font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.cal-list-item { padding: 4px 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cal-list-item .cal-ev { display: inline-block; font-size: .86rem; white-space: normal; }

/* Dialogue */
dialog.confirm { border: 1px solid var(--line); border-radius: 14px; padding: 0; max-width: 460px; width: calc(100% - 32px); box-shadow: var(--shadow-lg); background: var(--surface); color: var(--ink); }
dialog.confirm::backdrop { background: rgba(7, 18, 28, .5); }
dialog.confirm .body { padding: 22px 22px 6px; }
dialog.confirm #confirm-typed { margin-top: 12px; }
dialog.confirm .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 20px; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: min(460px, calc(100vw - 32px)); }
#toasts .alert { margin: 0; box-shadow: var(--shadow-lg); animation: slidein .2s ease; }
@keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Connexion ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; background: var(--surface); }
.auth-side { position: relative; overflow: hidden; background: var(--side); color: var(--side-fg); padding: 52px 56px; display: flex; flex-direction: column; justify-content: space-between; }
.auth-side::before { content: ""; position: absolute; inset: auto -140px -160px auto; width: 460px; height: 460px; border-radius: 50%; border: 56px solid color-mix(in srgb, var(--brand) 18%, transparent); }
.auth-side::after { content: ""; position: absolute; right: 70px; top: 80px; width: 14px; height: 14px; border-radius: 50%; background: var(--brand); box-shadow: -190px 120px 0 -3px color-mix(in srgb, var(--brand) 55%, transparent); }
.auth-side > * { position: relative; }
.auth-side .logo-card { background: #fff; border-radius: 14px; padding: 16px 20px; display: inline-block; }
.auth-side .logo-card img { width: 240px; display: block; }
.auth-side h2 { color: #fff; font-size: 2rem; font-weight: 600; margin-top: 44px; max-width: 15em; }
.auth-side ul { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 12px; max-width: 28em; }
.auth-side li { display: flex; gap: 12px; align-items: baseline; }
.auth-side li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; transform: translateY(-2px); }
.auth-side small { color: var(--side-fg-2); }
.auth-form { display: flex; align-items: center; justify-content: center; padding-block: 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.auth-form .box { width: 100%; max-width: 390px; }
.auth-form .box .logo-small { display: none; width: 220px; margin: 0 auto 24px; background: #fff; border-radius: 10px; padding: 8px 12px; }
.auth-form h1 { font-size: 1.7rem; }
.auth-form .hint-box { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: .86rem; color: var(--ink-2); }

/* ---------- Documents imprimables ---------- */
body.printing-doc { background: var(--bg); }
.doc-toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: color-mix(in srgb, var(--surface) 94%, transparent); border-bottom: 1px solid var(--line); }
.doc { background: #fff; color: #0d2236; max-width: 960px; margin: 24px auto; padding: 36px 44px; box-shadow: var(--shadow-lg); border-radius: 4px; font-size: .92rem; }
.doc h1, .doc h2, .doc strong, .doc b { color: #0d2236; }
.doc-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 3px solid #00aeef; padding-bottom: 12px; margin-bottom: 18px; }
.doc-head img { width: 190px; }
.doc-head div { text-align: right; font-size: .82rem; color: #64788c; }
.doc h1 { font-size: 1.45rem; margin-bottom: 4px; }
.doc h2 { font-size: 1.02rem; color: #0077b6; margin: 18px 0 8px; text-transform: none; }
.doc-sub { color: #3b5168; margin-bottom: 14px; }
.doc-table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-bottom: 8px; }
.doc-table th { background: #0077b6; color: #fff; text-align: left; padding: 6px 8px; font-weight: 600; }
.doc-table td { padding: 6px 8px; border-bottom: 1px solid #dbe3ea; vertical-align: top; color: #0d2236; }
.doc-table tbody tr:nth-child(even) td { background: #f1f7fb; }
.doc-table tr.hl td { background: #fdf0dc !important; }
.doc-foot { margin-top: 28px; padding-top: 8px; border-top: 1px solid #dde6ee; font-size: .75rem; color: #64788c; }
.doc .sign { text-align: right; margin-top: 30px; }
.doc .confid { color: #b42318; font-style: italic; font-size: .85rem; }
.print-header { display: none; }

/* ---------- Adaptation aux écrans ---------- */
@media (max-width: 1100px) {
  .grid.side, .grid.cols-3 { grid-template-columns: minmax(0, 1fr); }
  .form-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(290px, 86vw); z-index: 50; transform: translateX(-100%); visibility: hidden; transition: transform .2s ease, visibility .2s; padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .sidebar { transform: none; visibility: visible; box-shadow: var(--shadow-lg); }
  body.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(7, 18, 28, .45); z-index: 40; }
  .menu-toggle { display: inline-grid; }
  .topbar { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .topbar .mobile-logo { display: block; }
  .topbar .title { display: none; }
  .user-chip { padding-right: 4px; }
  .user-chip .who { display: none; }
  .save-state span { display: none; }
  .save-state { padding: 9px; }
  .content { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid.cols-2 { grid-template-columns: minmax(0, 1fr); }
  .auth { grid-template-columns: minmax(0, 1fr); }
  .auth-side { display: none; }
  .auth-form .box .logo-small { display: block; }
}
@media (max-width: 640px) {
  .form-grid, .form-grid.cols-3, .form-grid.cols-4 { grid-template-columns: minmax(0, 1fr); }
  .slot-choice { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.35rem; }

/* =====================================================================
   Base de données en ligne (Supabase) : même interface que la base
   intégrée (collection/doc, get/set/delete, onSnapshot), pour que
   toutes les copies de l'application — fichier ou lien — enregistrent
   automatiquement au même endroit.
   ===================================================================== */
/* global SUPA_URL, SUPA_KEY */
const SUPA_ON = typeof SUPA_URL === 'string' && SUPA_URL.length > 0;
// Session personnelle délivrée par le serveur après connexion (12 h, prolongée à l'usage)
const SupaSession = {
  key: 'ipein-examens:session-token',
  get() { try { return localStorage.getItem(this.key) || this.mem || null; } catch { return this.mem || null; } },
  set(t) { this.mem = t; try { localStorage.setItem(this.key, t); } catch { /* mémoire */ } },
  clear() { this.mem = null; try { localStorage.removeItem(this.key); } catch { /* ignoré */ } },
};

function makeSupaDB() {
  const err = (code, msg) => Object.assign(new Error(msg || code), { code });
  let onAuthLost = null;
  async function rpc(fn, args = {}, auth = true) {
    let r;
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 25000);
    try {
      r = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST',
        headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(auth ? { p_token: SupaSession.get() || '', ...args } : args),
        signal: ctl ? ctl.signal : undefined,
        cache: 'no-store',
      });
    } catch { throw err('unavailable', 'réseau'); } finally { clearTimeout(t); }
    if (!r.ok) {
      if (r.status === 401 || r.status === 403) { if (auth && onAuthLost) onAuthLost(); throw err('unauthenticated', 'session'); }
      const code = r.status === 429 ? 'resource_exhausted' : (r.status >= 500 || r.status === 408) ? 'unavailable' : 'invalid_argument';
      throw err(code, `HTTP ${r.status}`);
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
  const clone = (b) => (b == null ? undefined : JSON.parse(JSON.stringify(b)));
  const snap = (id, body) => ({ id, exists: body != null, data: () => clone(body), metadata: { fromCache: false, hasPendingWrites: false } });

  /* Suivi des changements faits par les autres : interrogation régulière */
  let since = null;
  const collL = new Map(); // collection -> Set(callback)
  const docL = new Map(); // chemin -> Set(callback)
  let timer = null;
  async function ensureSince() { if (since === null) since = Date.parse(await rpc('ipein_now')); }
  async function poll() {
    timer = null;
    try {
      await ensureSince();
      const from = new Date(since - 15000).toISOString(); // recouvrement : rien n'est manqué
      const rows = (await rpc('ipein_since', { p_since: from })) || [];
      const byColl = new Map();
      for (const row of rows) {
        const ts = Date.parse(row.updated_at); if (ts > since) since = ts;
        const i = row.path.lastIndexOf('/'); const coll = row.path.slice(0, i); const id = row.path.slice(i + 1);
        const ch = row.deleted ? { type: 'removed', doc: snap(id, null) } : { type: 'modified', doc: snap(id, row.body) };
        if (!byColl.has(coll)) byColl.set(coll, []);
        byColl.get(coll).push(ch);
        const dl = docL.get(row.path);
        if (dl && !row.deleted) dl.forEach((fn) => { try { fn(snap(id, row.body)); } catch (e) { console.warn(e); } });
      }
      for (const [coll, changes] of byColl) {
        const ls = collL.get(coll); if (!ls) continue;
        const s = { docs: [], size: 0, empty: true, docChanges: () => changes, metadata: { fromCache: false, hasPendingWrites: false } };
        ls.forEach((fn) => { try { fn(s); } catch (e) { console.warn(e); } });
      }
    } catch { /* nouvel essai au prochain passage */ }
    schedule();
  }
  function schedule() {
    if (timer || (!collL.size && !docL.size)) return;
    timer = setTimeout(poll, document.visibilityState === 'hidden' ? 20000 : 4000);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && timer) { clearTimeout(timer); timer = null; poll(); } });
  const listen = (map, key, fn) => {
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(fn); schedule();
    return () => { const s = map.get(key); if (s) { s.delete(fn); if (!s.size) map.delete(key); } };
  };

  function docRef(path) {
    const id = path.slice(path.lastIndexOf('/') + 1);
    return {
      id, path,
      async get() { await ensureSince(); const b = await rpc('ipein_get', { p_path: path }); return snap(id, b); },
      async set(body) {
        if (!body || typeof body !== 'object' || Array.isArray(body)) throw err('invalid_argument');
        if (JSON.stringify(body).length > 900 * 1024) throw err('invalid_argument', 'document trop volumineux');
        await rpc('ipein_put', { p_path: path, p_body: body });
      },
      async delete() { await rpc('ipein_del', { p_path: path }); },
      onSnapshot(next) { return listen(docL, path, next); },
    };
  }
  function collRef(path) {
    return {
      path,
      doc: (id) => docRef(`${path}/${id}`),
      // Lecture complète de la collection, page par page (ordre des chemins)
      async readAll() {
        await ensureSince();
        const out = []; let after = '';
        for (let guard = 0; guard < 200; guard++) {
          const rows = (await rpc('ipein_list', { p_coll: path, p_after: after, p_limit: 1000 })) || [];
          for (const r of rows) out.push(snap(r.path.slice(path.length + 1), r.body));
          if (rows.length < 1000) break;
          after = rows[rows.length - 1].path;
        }
        return out;
      },
      onSnapshot(next) { return listen(collL, path, next); },
    };
  }
  function stop() { collL.clear(); docL.clear(); if (timer) { clearTimeout(timer); timer = null; } since = null; }
  return Object.freeze({
    supa: true, doc: docRef, collection: collRef, stop,
    ping: () => rpc('ipein_state', {}, false),
    state: () => rpc('ipein_state', {}, false),
    setup: () => rpc('ipein_setup', {}, false),
    salt: (email) => rpc('ipein_salt', { p_email: email }, false),
    login: (email, hash) => rpc('ipein_login', { p_email: email, p_hash: hash }, false),
    logout: () => rpc('ipein_logout', { p_token: SupaSession.get() || '' }, false),
    onAuthLost: (fn) => { onAuthLost = fn; },
  });
}

const APP_KEY = 'ipein-examens-v1';
const VIEWER = Boolean(window.claude && typeof window.claude.use === 'function');

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

class AppError extends Error {}

/* ---------- Dates ---------- */
const pad = (n) => String(n).padStart(2, '0');

/* ---------- Téléchargements ---------- */
// Dans l'application publiée, les téléchargements passent par la capacité « downloads » ;
// hors ligne (fichier ouvert directement), par un lien de téléchargement classique.
async function download(data, name, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const dl = await Store.capability('downloads');
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; } catch (err) {
      if (err && err.code === 'declined') return false;
      if (err && err.code === 'rate_limited') fail('Un téléchargement est déjà en attente de confirmation.');
      if (!['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(err && err.code)) fail(`Téléchargement impossible (${(err && err.message) || 'erreur inconnue'}).`);
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

function toCSV(columns, rows) {
  const q = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return `﻿${[columns.map((c) => q(c[1])).join(';'), ...rows.map((r) => columns.map((c) => q(r[c[0]])).join(';'))].join('\r\n')}`;
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = []; let cur = ''; let inq = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inq) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') inq = false; else cur += c;
    } else if (c === '"') inq = true;
    else if (c === d) { row.push(cur.trim()); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows.filter((r) => r.some((c) => c !== ''));
}

function assign({ examRoomId, teacherId, force = false, source = 'manuel', replaces = null, status = null }) {

    session: ctx.session, ctx, exams: where('exams', (x) => x.session_id === sid && x.status === 'planifie').length, examRooms: ctx.examRooms.length, creneaux: ctx.cr.length,
    seats, filled, remaining: seats - filled, roomsCovered: ctx.examRooms.filter((er) => filledOf(er) >= er.supervisors_needed).length,
    confirmed, proposed: ctx.assignments.length - confirmed, coverage: seats ? Math.round((filled / seats) * 100) : 0,
    teachersCount: ctx.teachers.length, submitted, pendingChoices: ctx.teachers.length - submitted,
    drafts: where('subs', (x) => x.session_id === sid && x.status === 'brouillon').length,
    conflicts: conflicts.length, blocking: conflicts.filter((c) => c.severity === 'erreur').length, conflictList: conflicts,
    loads, mean: Math.round(mean * 10) / 10, sd: Math.round(sd * 10) / 10,
    pendingAbsences: where('absences', (r) => r.status === 'en_attente' && aIds.has(r.assignment_id)).length,
  };
}
function byDay(sid) {
  const ctx = loadContext(sid); const m = new Map();
  for (const er of ctx.examRooms) {
    const d = ctx.crById.get(er.creneau_id).date;
    const x = m.get(d) || { date: d, needed: 0, assigned: 0 };
    x.needed += er.supervisors_needed; x.assigned += Math.min(er.supervisors_needed, ctx.assignments.filter((a) => a.exam_room_id === er.id).length);
    m.set(d, x);
  }
  return [...m.values()].sort((a, b) => a.date.localeCompare(b.date));
}
function incompleteRooms(sid) {
  const ctx = loadContext(sid);
  return ctx.examRooms.map((er) => ({ ...er, assigned: ctx.assignments.filter((a) => a.exam_room_id === er.id).length, c: ctx.crById.get(er.creneau_id) }))
    .filter((x) => x.assigned < x.supervisors_needed).sort((a, b) => a.c.date.localeCompare(b.c.date) || a.c.start_time.localeCompare(b.c.start_time));
}

function sendTirageReminder(t) {
  const ids = where('tparts', (p) => p.tirage_id === t.id && p.response !== 'decline').map((p) => p.user_id);
  const s = get('subjects', t.subject_id);
  notify(ids, { title: `Rappel : tirage ${s.name}`, body: `Rappel du rendez-vous de tirage : ${fmtDate(t.date, true)} de ${fmtTime(t.start_time)} à ${fmtTime(t.end_time)}, lieu : ${t.location}.`, link: `#/tirages/${t.id}`, kind: 'rappel' });
  t.reminder_sent_at = nowLocal();
  ins('thist', { tirage_id: t.id, actor_id: ME ? ME.id : null, action: 'rappel', details: `${ids.length} destinataire(s)` });
  return ids.length;
}
function runScheduler() {
  if (Store.readOnly || Store.mode === 'loading') return;
  try {
    tx(() => {
      const now = new Date();
      const nowS = nowLocal().slice(0, 16);
      const limit = new Date(now.getTime() + Number(setting('reminder_hours_before') || 24) * 3600 * 1000);
      for (const t of DB.tirages) {
        if (!['planifie', 'modifie'].includes(t.status) || t.reminder_sent_at) continue;
        const when = new Date(`${t.date}T${t.start_time}:00`);
        if (when >= now && when <= limit) sendTirageReminder(t);
      }
      for (const s of DB.sessions) {
        if (s.status === 'choix_ouverts' && s.choices_close_at && s.choices_close_at < nowS) {
          s.status = 'choix_clos';
          addHistory(s.id, null, 'statut_choix_clos', null, 'Clôture automatique à la date limite');
          audit('session_choix_clos_auto', 'session', s.id);
        }
        if (s.status === 'choix_ouverts' && s.choices_close_at && !DB.settings.reminders_sent[s.id]) {
          const close = new Date(s.choices_close_at.replace(' ', 'T'));
          if (close - now <= 48 * 3600 * 1000 && close > now) {
            const ids = activeTeachers().filter((t) => !where('subs', (x) => x.session_id === s.id && x.teacher_id === t.id && x.status === 'soumis').length).map((t) => t.id);
            notify(ids, { title: `Dernier rappel : choix des surveillances (${s.name})`, body: `La date limite est fixée au ${fmtDT(s.choices_close_at)}. Vos choix ne sont pas encore soumis.`, link: '#/mes-disponibilites', kind: 'rappel' });
            DB.settings.reminders_sent[s.id] = nowLocal();
          }
        }
      }
    });
  } catch (err) { console.error('[planificateur]', err); }
}

}

function qs(over = {}, base = R.query) {

const ROUTES = [];

function confirmDlg(text, danger = false, label = 'Confirmer', typed = '') {

    const dlg = $('#confirm-dialog');
    $('#confirm-text').textContent = text;
    const ok = $('#confirm-ok'); ok.textContent = label; ok.className = danger ? 'btn danger' : 'btn';
    const box = $('#confirm-typed'); const inp = $('#confirm-input');
    box.hidden = !typed; inp.value = ''; ok.disabled = Boolean(typed);
    inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== typed; };
    dlg.returnValue = '';
    try { dlg.showModal(); } catch { dlg.setAttribute('open', ''); }
    if (typed) setTimeout(() => inp.focus(), 30);

function listing(rows, { search = null, sorts = {}, defaultSort = null, defaultDir = 'asc', perPage = 20 }) {
  const q = R.query;
  const term = (q.q || '').trim().toLowerCase();
  let out = term && search ? rows.filter((r) => search(r).toLowerCase().includes(term)) : rows.slice();
  const sort = sorts[q.tri] ? q.tri : defaultSort;
  const dir = q.ordre === 'desc' ? 'desc' : q.ordre === 'asc' ? 'asc' : defaultDir;
  if (sort) {
    const f = sorts[sort];
    out.sort((a, b) => { const x = f(a) ?? ''; const y = f(b) ?? ''; const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'fr'); return dir === 'asc' ? c : -c; });
  }
  const pages = Math.max(1, Math.ceil(out.length / perPage));
  const page = Math.min(Math.max(1, Number(q.page) || 1), pages);
  return { rows: out.slice((page - 1) * perPage, page * perPage), total: out.length, page, pages, sort, dir, term: q.q || '' };
}
const sortLink = (l, key, label) => {
  const active = l.sort === key;
  return `<a href="${qs({ tri: key, ordre: active && l.dir === 'asc' ? 'desc' : 'asc', page: 1 })}" class="${active ? 'sorted' : ''}">${e(label)}${active ? (l.dir === 'asc' ? ' ▲' : ' ▼') : ''}</a>`;
};
function pager(l) {
  if (!l.total) return '';
  let links = '';
  if (l.pages > 1) {
    if (l.page > 1) links += `<a href="${qs({ page: l.page - 1 })}" aria-label="Page précédente">‹</a>`;
    for (let p = Math.max(1, l.page - 2); p <= Math.min(l.pages, l.page + 2); p++) links += p === l.page ? `<span class="cur">${p}</span>` : `<a href="${qs({ page: p })}">${p}</a>`;
    if (l.page < l.pages) links += `<a href="${qs({ page: l.page + 1 })}" aria-label="Page suivante">›</a>`;
  }
  return `<div class="pagination"><span>${l.total} résultat${l.total > 1 ? 's' : ''} — page ${l.page} sur ${l.pages}</span><nav class="pages">${links}</nav></div>`;
}
const searchBox = (ph = 'Rechercher…') => `<div class="field grow"><label>Recherche<input type="search" name="q" value="${e(R.query.q || '')}" placeholder="${e(ph)}"></label></div>`;

let lastPath = null;
function render() {
  ME = currentUser();
  const parsed = parseHash();
  R = { ...parsed, params: {} };
  const root = $('#app');
  let out;
  try {
    if (!DB.users.length && !Store.needsLogin) out = { bare: true, html: viewSetup() };
    else if (!ME) out = { bare: true, html: viewLogin() };
    else if (ME.must_change_password && R.path !== '/mon-compte/mot-de-passe') { ROUTE = '/mon-compte/mot-de-passe'; render(); return; }
    else {
      const r = ROUTES.find((x) => x.re.test(R.path));
      if (!r) out = { title: 'Page introuvable', html: card('', empty('Page introuvable', 'Cette adresse n’existe pas.', 'alert', null)) };
      else {
        R.params = R.path.match(r.re).groups || {};
        out = allowed(r.access) ? r.view(R.params) : { title: 'Accès refusé', html: card('', empty('Accès refusé', 'Vous n’avez pas les droits nécessaires pour cette page.', 'lock')) };
      }
    }
  } catch (err) {
    console.error(err);
    out = { title: 'Erreur', html: card('', empty(err instanceof AppError ? err.message : 'Une erreur est survenue.', err instanceof AppError ? '' : String(err.message || err), 'alert')) };
  }
  document.body.classList.toggle('printing-doc', Boolean(out.doc));
  root.innerHTML = out.bare || out.doc ? out.html : shell(out.title, out.html);
  document.title = `${out.title || 'Connexion'} · IPEIN Examens`;
  FLASH = null;
  document.body.classList.remove('nav-open');
  if (lastPath !== R.path) { window.scrollTo(0, 0); lastPath = R.path; }
  if (out.after) out.after();
  Store.remoteDirty = false;
  Store.updateIndicator();
  showRemoteBadge(false);
  const af = $('[autofocus]', root); if (af) af.focus();
}

/* ---------- Calendrier (mois / liste) ---------- */
function calendarEvents(from, to, sid) {
  const ev = [];
  const COLORS = { vacances: '#94a3b8', ferie: '#f59e0b', examens: '#00aeef', cours: '#cbd5e1', autre: '#a78bfa' };
  for (const x of DB.events) if (x.end_date >= from && x.start_date <= to) ev.push({ start: x.start_date, end: x.end_date, title: x.title, color: COLORS[x.kind], allDay: true });
  if (isStaff()) {
    for (const x of DB.exams) {
      if (x.status !== 'planifie' || (sid && x.session_id !== sid)) continue;
      const c = get('creneaux', x.creneau_id); if (c.date < from || c.date > to) continue;
      const l = examLine(x);
      ev.push({ start: c.date, end: c.date, time: c.start_time, endTime: c.end_time, title: `${get('classes', x.class_id).code} · ${get('subjects', x.subject_id).name}`, color: l.got >= l.need ? '#0f766e' : '#c2410c', href: `#/examens/${x.id}`, detail: `Salles : ${l.rooms} · ${l.got}/${l.need} surveillants` });
    }
  } else {
    for (const a of activeAssign((x) => x.teacher_id === ME.id)) {
      const d = describeAssignment(a); if (d.date < from || d.date > to) continue;
      const pub = get('sessions', a.session_id).status === 'publie';
      ev.push({ start: d.date, end: d.date, time: d.start_time, endTime: d.end_time, title: `Surveillance ${d.room_code} · ${d.class_code}`, color: pub ? '#0077b6' : '#64748b', href: '#/mon-planning', detail: `${d.subject_name} — ${pub ? 'confirmée' : 'provisoire'}` });
    }
  }
  const tirs = isStaff() ? DB.tirages : DB.tirages.filter((t) => where('tparts', (p) => p.tirage_id === t.id && p.user_id === ME.id).length);
  for (const t of tirs) if (t.status !== 'annule' && t.date >= from && t.date <= to && (!sid || t.session_id === sid)) ev.push({ start: t.date, end: t.date, time: t.start_time, endTime: t.end_time, title: `Tirage · ${get('subjects', t.subject_id).name}`, color: '#7c3aed', href: `#/tirages/${t.id}`, detail: `Lieu : ${t.location}` });
  return ev.sort((a, b) => a.start.localeCompare(b.start) || (a.allDay ? -1 : 1) || String(a.time).localeCompare(String(b.time)));
}
function viewCalendar() {
  const sid = Number(R.query.session) || null;
  let month = R.query.mois;
  if (!month) {
    const s = sid ? get('sessions', sid) : null;
    month = (s ? s.start_date : today()).slice(0, 7);
  }
  const [y, m] = month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const last = new Date(y, m, 0);
  const end = new Date(last); end.setDate(last.getDate() + (7 - ((last.getDay() + 6) % 7)) - 1);
  const evs = calendarEvents(isoDate(start), isoDate(end), sid);
  const prev = isoDate(new Date(y, m - 2, 1)).slice(0, 7); const next = isoDate(new Date(y, m, 1)).slice(0, 7);
  const vue = R.query.vue === 'liste' ? 'liste' : 'mois';
  const evHtml = (x) => `<a class="cal-ev${x.allDay ? ' all' : ''}" style="--c:${x.color}" ${x.href ? `href="${x.href}"` : ''} title="${e(`${x.title}${x.detail ? `\n${x.detail}` : ''}`)}">${x.time ? `<b>${fmtTime(x.time)}</b> ` : ''}${e(x.title)}</a>`;
  let body;
  if (vue === 'mois') {
    let cells = '';
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const ds = isoDate(d);
      const inM = d.getMonth() === m - 1;
      const list = evs.filter((x) => x.start <= ds && x.end >= ds);
      cells += `<div class="cal-cell${inM ? '' : ' out'}${ds === today() ? ' today' : ''}"><div class="cal-day">${d.getDate()}</div>${list.slice(0, 4).map(evHtml).join('')}${list.length > 4 ? `<a class="cal-more" href="${qs({ vue: 'liste', mois: month })}">+${list.length - 4} autre(s)</a>` : ''}</div>`;
    }
    body = `<div class="cal-grid">${['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map((j) => `<div class="cal-head">${j}</div>`).join('')}${cells}</div>`;
  } else {
    const inMonth = evs.filter((x) => x.end >= `${month}-01` && x.start <= isoDate(last));
    const days = [...new Set(inMonth.map((x) => (x.start < `${month}-01` ? `${month}-01` : x.start)))].sort();
    body = days.length ? days.map((d) => `<div class="cal-list-day"><h3>${cap(fmtDate(d, true))}</h3>${inMonth.filter((x) => (x.start < `${month}-01` ? `${month}-01` : x.start) === d).map((x) => `<div class="cal-list-item">${evHtml(x)}${x.detail ? `<span class="muted"> — ${e(x.detail)}</span>` : ''}</div>`).join('')}</div>`).join('') : empty('Aucun événement ce mois-ci', '', 'calendar');
  }
  const legend = isStaff()
    ? '<span><i style="background:#0f766e"></i>Examen couvert</span><span><i style="background:#c2410c"></i>Surveillants manquants</span>'
    : '<span><i style="background:#0077b6"></i>Surveillance confirmée</span><span><i style="background:#64748b"></i>Surveillance provisoire</span>';
  const html = pageHead('Calendrier', isStaff() ? 'Examens, tirages et calendrier universitaire.' : 'Vos surveillances, tirages et le calendrier universitaire.', isStaff() ? `<form data-filter><input type="hidden" name="vue" value="${vue}">${sessionSelect(sid || '', { all: true })}</form>` : '')
    + `<div class="card"><div class="card-head"><div class="actions"><a class="btn secondary sm" href="${qs({ mois: prev })}" aria-label="Mois précédent">‹</a><a class="btn secondary sm" href="${qs({ mois: next })}" aria-label="Mois suivant">›</a><a class="btn secondary sm" href="${qs({ mois: today().slice(0, 7) })}">Aujourd’hui</a></div>
      <h2 style="text-transform:capitalize">${MOIS[m - 1]} ${y}</h2>
      <div class="seg-links"><a class="${vue === 'mois' ? 'active' : ''}" href="${qs({ vue: 'mois' })}">Mois</a><a class="${vue === 'liste' ? 'active' : ''}" href="${qs({ vue: 'liste' })}">Liste</a></div></div>
      <div class="card-body"><div class="legend" style="margin-bottom:12px">${legend}<span><i style="background:#7c3aed"></i>Tirage</span><span><i style="background:#94a3b8"></i>Vacances</span><span><i style="background:#f59e0b"></i>Jour férié</span><span><i style="background:#00aeef"></i>Période d’examens</span></div>${body}</div></div>`;
  return { title: 'Calendrier', html };
}

/* ---------- Statistiques ---------- */
function viewStats() {
  const sid = Number(R.query.session) || defaultSessionId();
  const st = sid ? stats(sid) : null;
  let html = pageHead('Statistiques', 'Couverture, participation et équité de la répartition.', sid ? `<form data-filter>${sessionSelect(sid)}</form><a class="btn secondary" href="#/imprimer/stats/${sid}">${icon('printer')}Rapport imprimable</a>` : '');
  if (!st) return { title: 'Statistiques', html: html + card('', empty('Aucune session', '', 'chart')) };
  html += `<div class="kpis">${kpi('Examens', st.exams, `${st.examRooms} salles · ${st.creneaux} créneaux`)}${kpi('Couverture', `${st.coverage} %`, `${st.filled}/${st.seats} postes`, st.coverage === 100 ? 'ok' : 'warn')}
    ${kpi('Participation aux choix', `${st.teachersCount ? Math.round((st.submitted / st.teachersCount) * 100) : 0} %`, `${st.submitted}/${st.teachersCount} enseignants`)}${kpi('Charge moyenne', st.mean, `écart-type ${st.sd}`)}${kpi('Conflits', st.conflicts, `${st.blocking} bloquant(s)`, st.conflicts ? 'warn' : 'ok')}</div>`;
  const dept = new Map();
  for (const l of st.loads) { const k = l.department || 'Non renseigné'; const x = dept.get(k) || { t: 0, a: 0 }; x.t++; x.a += l.load; dept.set(k, x); }
  const dist = {}; for (const l of st.loads) dist[l.load] = (dist[l.load] || 0) + 1;
  const maxN = Math.max(1, ...Object.values(dist));
  html += `<div class="grid cols-2">${card('Couverture par jour', bars(byDay(sid)))}${card('Par département', `<table class="table"><thead><tr><th>Département</th><th>Enseignants</th><th>Surveillances</th><th>Moyenne</th></tr></thead><tbody>${[...dept].sort((a, b) => b[1].a - a[1].a).map(([k, v]) => `<tr><td>${e(k)}</td><td>${v.t}</td><td>${v.a}</td><td>${(v.a / v.t).toFixed(1)}</td></tr>`).join('')}</tbody></table>`, { tight: true })}</div>`;
  html += card('Distribution des charges', `<div class="bars">${Object.keys(dist).map(Number).sort((a, b) => a - b).map((k) => `<div class="bar-row"><span>${k} surveillance${k > 1 ? 's' : ''}</span><div class="track"><span style="width:${Math.round((dist[k] / maxN) * 100)}%"></span></div><span class="muted">${dist[k]} ens.</span></div>`).join('')}</div>`);
  return { title: 'Statistiques', html };
}

  const s = sessionFull(id); const w = choiceWindow(s); const st = stats(s.id);
  const crs = sessionCreneaux(s.id).map((c) => {
    const ex = where('exams', (x) => x.creneau_id === c.id && x.status === 'planifie');
    const needed = where('examRooms', (er) => er.creneau_id === c.id && ex.some((x) => x.id === er.exam_id)).reduce((a, er) => a + er.supervisors_needed, 0);
    return { ...c, exams: ex.length, needed, available: where('avail', (a) => a.creneau_id === c.id && a.state === 'disponible').length };
  });
  const trans = [];
  if (['brouillon', 'choix_clos'].includes(s.status)) trans.push(act('sessionStatus', 'Ouvrir la période de choix', { id: s.id, to: 'choix_ouverts' }, { cls: '', confirm: 'Ouvrir la période de choix ? Tous les enseignants actifs seront notifiés.' }));
  if (s.status === 'choix_ouverts') trans.push(act('sessionStatus', 'Clore la période de choix', { id: s.id, to: 'choix_clos' }, { cls: 'secondary', confirm: 'Clore la période de choix ?' }));
  if (['choix_ouverts', 'choix_clos'].includes(s.status)) trans.push(act('sessionStatus', 'Repasser en brouillon', { id: s.id, to: 'brouillon' }, { cls: 'ghost', confirm: 'Repasser la session en brouillon ?' }));
  trans.push(s.status !== 'publie' ? `<a class="btn secondary" href="#/planning?session=${s.id}">Affecter puis publier le planning →</a>` : `<span class="badge ok">Planning publié le ${fmtDT(s.published_at)}</span>`);
  const hist = where('history', (h) => h.session_id === s.id && !h.assignment_id).slice(-20).reverse();
  const crEdit = R.query.cr ? get('creneaux', R.query.cr) : null;
  const html = pageHead(`${e(s.name)} ${badge(s.status)}`, `${s.year_label} · ${s.semester_label} · du ${fmtDate(s.start_date)} au ${fmtDate(s.end_date)}`,
    `<a class="btn secondary" href="#/examens?session=${s.id}">${icon('clipboard')}Examens (${st.exams})</a><a class="btn secondary" href="#/choix?session=${s.id}">${icon('checkSquare')}Suivi des choix</a><a class="btn" href="#/planning?session=${s.id}">${icon('grid')}Planning</a>`, '<a href="#/sessions">Sessions d’examens</a> /')
    + card('Cycle de la session', `<div class="actions">${trans.join('')}</div>`, { right: `<span class="muted" style="font-size:.88rem">${w.open ? 'Période de choix ouverte' : e(w.reason)}</span>` })
    + `<div class="grid cols-2" style="margin-top:18px">${card('Paramètres et règles', `<form data-form="sessionSave" data-id="${s.id}">${sessionFields(s)}<div class="form-actions">${ME.role === 'admin' ? act('sessionDelete', `${icon('trash')}Supprimer`, { id: s.id }, { cls: 'danger', danger: true, confirm: 'Supprimer définitivement cette session et ses créneaux ? (Impossible si des examens existent.)' }) : ''}<button class="btn" type="submit">Enregistrer</button></div></form>`)}
    ${card(`Créneaux (${crs.length})`, `${crs.length ? `<div class="table-wrap" style="max-height:420px;overflow-y:auto"><table class="table"><thead><tr><th>Date</th><th>Horaire</th><th>Examens</th><th>Besoin</th><th>Disponibles</th><th></th></tr></thead><tbody>${crs.map((c) => `<tr><td class="nowrap">${fmtDate(c.date, true)}</td><td class="nowrap">${fmtTime(c.start_time)}–${fmtTime(c.end_time)}</td><td>${c.exams}</td><td>${c.needed}</td><td><span class="badge ${c.available >= c.needed ? 'ok' : c.needed ? 'warn' : 'gray'}">${c.available}</span></td><td class="actions-cell"><a class="btn sm secondary" href="#/sessions/${s.id}?cr=${c.id}" title="Modifier" aria-label="Modifier">${icon('edit')}</a>${c.exams ? '' : act('creneauDelete', icon('trash'), { id: c.id }, { cls: 'sm danger', confirm: 'Supprimer ce créneau ?', danger: true, title: 'Supprimer' })}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="padding:14px 18px">Aucun créneau : ajoutez-les un par un ou générez-les en série.</p>'}
      <div style="padding:14px 18px;border-top:1px solid var(--line)"><form data-form="creneauAdd" data-id="${s.id}"${crEdit ? ` data-cid="${crEdit.id}"` : ''}><h3>${crEdit ? 'Modifier le créneau' : 'Ajouter un créneau'}</h3><div class="form-grid cols-3">${field('Date', inp('date', crEdit ? crEdit.date : '', `type="date" min="${s.start_date}" max="${s.end_date}" required`))}${field('Début', inp('start_time', crEdit ? crEdit.start_time : '08:30', 'type="time" required'))}${field('Fin', inp('end_time', crEdit ? crEdit.end_time : '10:30', 'type="time" required'))}</div><div class="form-actions">${crEdit ? `<a class="btn ghost" href="#/sessions/${s.id}">Annuler</a>` : ''}<button class="btn secondary" type="submit">${crEdit ? 'Enregistrer' : `${icon('plus')}Ajouter le créneau`}</button></div></form>
      <details><summary style="cursor:pointer;font-weight:600;color:var(--brand-600)">Générer plusieurs créneaux</summary><form data-form="creneauxGenerate" data-id="${s.id}" style="margin-top:12px"><div class="form-grid">${field('Du', inp('from', s.start_date, `type="date" min="${s.start_date}" max="${s.end_date}" required`))}${field('Au', inp('to', s.end_date, `type="date" min="${s.start_date}" max="${s.end_date}" required`))}${field('Plages horaires', inp('plages', '08:30-10:30, 11:00-13:00, 14:00-16:00', 'required'), { full: true, hint: 'Séparées par des virgules ; les dimanches sont exclus.' })}</div><label class="check" style="margin-top:10px"><input type="checkbox" name="saturday"> Inclure les samedis</label><div class="form-actions"><button class="btn secondary" type="submit">Générer</button></div></form></details></div>`, { tight: true, id: 'creneaux' })}</div>`
    + card('Historique de la session', `<ul class="list">${hist.map((h) => `<li style="font-size:.86rem"><div class="grow"><strong>${e(h.action.replace(/_/g, ' '))}</strong>${h.note ? ` — ${e(h.note)}` : ''}<div class="meta">${fmtDT(h.created_at)} · ${h.actor_id ? e(userName(h.actor_id)) : 'Système'}</div></div></li>`).join('') || '<li class="muted">Aucun événement.</li>'}</ul>`, { tight: true, right: `<a href="#/planning?session=${s.id}&onglet=historique">Historique complet</a>` });
  return { title: s.name, html };
}

/* ---------- Examens ---------- */
function examFull(x) {
  const c = get('creneaux', x.creneau_id); const sj = get('subjects', x.subject_id); const cl = get('classes', x.class_id);
  return { ...x, date: c.date, start_time: c.start_time, end_time: c.end_time, subject_name: sj.name, subject_code: sj.code, class_code: cl.code, class_name: cl.name, student_count: cl.student_count, session: get('sessions', x.session_id) };
}
function viewExams() {
  const sid = Number(R.query.session) || defaultSessionId();
  const q = R.query;
  let rows = where('exams', (x) => x.session_id === sid).map((x) => ({ ...examFull(x), ...examLine(x) }));
  if (q.classe) rows = rows.filter((x) => x.class_id === Number(q.classe));
  if (q.matiere) rows = rows.filter((x) => x.subject_id === Number(q.matiere));

    <div class="field"><label>Matière<select name="matiere" data-autosubmit>${opt('', 'Toutes', q.matiere)}${DB.subjects.map((s) => opt(s.id, s.name, q.matiere)).join('')}</select></label></div>

    <div class="field"><label>Statut<select name="statut" data-autosubmit>${opt('', 'Tous', q.statut)}${opt('planifie', 'Planifiés', q.statut)}${opt('annule', 'Annulés', q.statut)}</select></label></div>`);

    : !l.rows.length ? empty('Aucun examen', l.term || q.classe || q.matiere || q.date ? 'Aucun examen ne correspond aux filtres.' : 'Programmez le premier examen de la session.', 'clipboard', { href: `#/examens/nouveau?session=${sid}`, label: 'Programmer un examen' })
      : table([sortLink(l, 'date', 'Date'), 'Horaire', sortLink(l, 'matiere', 'Matière'), sortLink(l, 'classe', 'Classe'), 'Salles', 'Responsable', 'Surveillants', 'Statut', ''], l.rows.map((x) => `<tr>${td('Date', fmtDate(x.date), 'nowrap')}${td('Horaire', `${fmtTime(x.start_time)}–${fmtTime(x.end_time)}`, 'nowrap')}${td('Matière', `<a href="#/examens/${x.id}"><strong>${e(x.subject_name)}</strong></a><span class="sub">${e(x.subject_code)}</span>`)}${td('Classe', e(x.class_code))}${td('Salles', e(x.rooms || '—'))}${td('Responsable', x.responsible_id ? e(userName(x.responsible_id)) : '—')}${td('Surveillants', `<span class="badge ${x.status === 'annule' ? 'gray' : x.got >= x.need ? 'ok' : 'warn'}">${x.got}/${x.need}</span>`)}${td('Statut', badge(x.status))}<td class="actions-cell"><a class="btn sm secondary" href="#/examens/${x.id}">Ouvrir</a></td></tr>`).join('')) + pager(l);
  return { title: 'Examens', html: pageHead('Examens', 'Programmation des épreuves, salles et besoins en surveillants.', sid ? `<button class="btn secondary" type="button" data-act="exportData" data-key="examens" data-session="${sid}" data-format="xlsx">${icon('download')}Excel</button><a class="btn secondary" href="#/imports?type=examens">${icon('upload')}Importer</a><a class="btn" href="#/examens/nouveau?session=${sid}">${icon('plus')}Programmer un examen</a>` : '') + `<div class="card">${tb}<div class="card-body tight">${body}</div></div>` };

        <template id="room-row"><div class="room-row" style="display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:8px;align-items:end;margin-bottom:8px">

function canSeeExam(x) { return isStaff() || x.responsible_id === ME.id; }
function viewExam({ id }) {

  if (staff) { audit('examen_consulte', 'exam', x.id); persistQuiet(); }
  const ers = where('examRooms', (r) => r.exam_id === x.id).map((er) => ({ ...er, room: get('rooms', er.room_id), as: activeAssign((a) => a.exam_room_id === er.id) }));
  const placed = ers.reduce((s, r) => s + r.students, 0);
  const free = where('rooms', (r) => r.active && !where('examRooms', (er) => er.creneau_id === x.creneau_id && er.room_id === r.id).length);

  const roomsHtml = (ers.length ? table(['Salle', 'Étudiants / surveillants requis', 'Affectés', staff ? '' : ''], ers.map((r) => `<tr>${td('Salle', `<strong>${e(r.room.code)}</strong><span class="sub">${e(r.room.name)} · ${r.room.capacity} places</span>`)}

      ${td('Affectés', `${r.as.length ? e(r.as.map((a) => userName(a.teacher_id)).join(', ')) : '<span class="missing">Aucun</span>'} <span class="badge ${r.as.length >= r.supervisors_needed ? 'ok' : 'warn'}">${r.as.length}/${r.supervisors_needed}</span>`)}
      <td class="actions-cell">${staff ? `<a class="btn sm secondary" href="#/planning/salle/${r.id}">Affecter</a>${!r.as.length && open ? act('examRoomDelete', icon('trash'), { id: r.id }, { cls: 'sm danger', danger: true, confirm: `Retirer la salle ${r.room.code} de l’examen ?`, title: 'Retirer' }) : ''}` : ''}</td></tr>`).join('')) : '<p class="muted" style="padding:14px 18px">Aucune salle affectée.</p>')
    + `<p style="padding:10px 18px;margin:0;border-top:1px solid var(--line)" class="${placed < x.student_count ? 'missing' : 'muted'}">Étudiants placés : ${placed} / ${x.student_count} (effectif de la classe)</p>`
    + (staff && open && free.length ? `<form data-form="examRoomAdd" data-id="${x.id}" style="padding:14px 18px;border-top:1px solid var(--line)"><div class="form-grid cols-4">${field('Salle libre', `<select name="room_id">${free.map((r) => opt(r.id, `${r.code} (${r.capacity} pl.)`)).join('')}</select>`)}${field('Étudiants', inp('students', Math.max(0, x.student_count - placed), 'type="number" min="0"'))}${field('Surveillants', inp('supervisors', 2, 'type="number" min="1" max="10"'))}<div class="field" style="align-self:end"><button class="btn secondary" type="submit">${icon('plus')}Ajouter</button></div></div></form>` : '');
  const html = pageHead(`${e(x.subject_name)} — ${e(x.class_code)} ${badge(x.status)}`, `${fmtDate(x.date, true)}, ${fmtTime(x.start_time)}–${fmtTime(x.end_time)} · ${x.session.name}`, actions, staff ? `<a href="#/examens?session=${x.session_id}">Examens</a> /` : '')
    + `<div class="grid side"><div>${card('Salles et surveillants', roomsHtml, { tight: true, right: staff ? `<a href="#/planning?session=${x.session_id}">Ouvrir le planning</a>` : '' })}
      ${card('Rendez-vous de tirage', `<ul class="list">${tirs.map((t) => `<li><div class="grow"><a href="#/tirages/${t.id}">${fmtDate(t.date, true)} à ${fmtTime(t.start_time)}</a><div class="meta">${e(t.location)}</div></div>${badge(t.status)}</li>`).join('') || '<li class="muted">Aucun tirage planifié pour cette épreuve.</li>'}</ul>`, { tight: true })}</div>
      <div>${card('Informations', `<dl class="props"><dt>Matière</dt><dd>${e(x.subject_name)} (${e(x.subject_code)})</dd><dt>Classe</dt><dd>${e(x.class_code)} — ${e(x.class_name)}</dd><dt>Effectif</dt><dd>${x.student_count} étudiants</dd><dt>Responsable</dt><dd>${x.responsible_id ? e(userName(x.responsible_id)) : '—'}</dd><dt>Modifié le</dt><dd>${fmtDT(x.updated_at || x.created_at)}</dd></dl>`)}
      <div class="card"><div class="card-body confidential"><div class="tag">${icon('lock')} Informations confidentielles</div>${x.confidential_notes ? `<p style="white-space:pre-line;margin:8px 0 0">${e(x.confidential_notes)}</p>` : '<p class="muted" style="margin:8px 0 0">Aucune note confidentielle.</p>'}<p class="muted" style="font-size:.78rem;margin:10px 0 0">Accès réservé au service des examens et à l’enseignant responsable ; chaque consultation est journalisée.</p></div></div></div></div>`;
  return { title: `${x.subject_name} — ${x.class_code}`, html };
}

/* ---------- Tirages ---------- */
const tirageParts = (tid) => where('tparts', (p) => p.tirage_id === tid);

    return { ...t, subject_name: get('subjects', t.subject_id).name, class_code: ex ? get('classes', ex.class_id).code : '', n: parts.length, conf: parts.filter((p) => p.response === 'confirme').length, mine: (parts.find((p) => p.user_id === ME.id) || {}).response };
  });

  if (q.periode === 'passes') rows = rows.filter((t) => t.date < today());
  const l = listing(rows, { search: (t) => `${t.subject_name} ${t.location} ${t.class_code}`, sorts: { date: (t) => t.date + t.start_time, matiere: (t) => t.subject_name, lieu: (t) => t.location, statut: (t) => t.status }, defaultSort: 'date' });

    <div class="field"><label>Période<select name="periode" data-autosubmit>${opt('', 'Toutes', q.periode)}${opt('a_venir', 'À venir', q.periode)}${opt('passes', 'Passés', q.periode)}</select></label></div>
